<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>LSS Task App</title>
</head>
<body>
    <h1>LSS Task App</h1>
    <h2>Task App</h2>
    
    <form id="taskForm">
        
        <label for="taskName">Task Name</label><br>
        <input type="text" id="taskName" name="taskName"><br>

        <label for="taskId">Id</label><br>
        <input type="text" id="taskId" name="taskId"><br>

        <label for="taskDescription">Description</label><br>
        <input type="text" id="taskDescription" name="taskDescription"><br>

        <label for="creationDate">Creation Date</label><br>
        <input type="datetime-local" id="creationDate" name="creationDate"><br>

        <label for="previewDate">Preview Date</label><br>
        <input type="datetime-local" name="previewDate" id="previewDate"><br>

        <label for="status">Status</label><br>
        <input type="text" id="status" name="status"><br>   

        <button id="sendBtn">Create</button>

    </form>


    <script src="script.js"></script>
</body>
</html>
